server:
  port: ${PORT:8080}

spring:
  application:
    name: finguard

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.us-east-1.prod.aws.tidbcloud.com:4000/sys?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3}
    username: ${SPRING_DATASOURCE_USERNAME:3T2gdZBxtztgLBY.root}
    password: ${SPRING_DATASOURCE_PASSWORD:sSaWWynp6GGnEggd}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

finguard:
  jwt:
    secret: ${JWT_SECRET:finguard-super-secret-key-change-this-in-production-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}