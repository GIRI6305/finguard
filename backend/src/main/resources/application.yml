server:
  port: ${PORT:8080}

spring:
  application:
    name: finguard

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:finguard}
    password: ${DB_PASSWORD:finguard}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

finguard:
  jwt:
    secret: ${JWT_SECRET:finguard-super-secret-key-change-this-in-production-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}